name: Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a tag, check it, submit to Hex, or finalize a public Hex release
        type: choice
        default: dry-run
        options:
          - dry-run
          - prepare
          - publish
          - finalize
      tag_name:
        description: Version tag to check or create when running from main (for example v0.5.1)
        type: string

concurrency:
  group: tune-hex-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  HEX_VERSION: "2.7.0"

jobs:
  verify:
    name: Verify release source and package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version and exact commit
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          REQUESTED_TAG: ${{ inputs.tag_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main && ("$RELEASE_OPERATION" == prepare || "$RELEASE_OPERATION" == dry-run) ]]; then
            tag="$REQUESTED_TAG"
          elif [[ "$RELEASE_OPERATION" != prepare && "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          else
            echo "Run prepare from main with a tag name. Run dry-run the same way or from a release tag. Run publish and finalize from a release tag." >&2
            exit 1
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a vMAJOR.MINOR.PATCH release tag." >&2
            exit 1
          fi

          version="${tag#v}"
          commit="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$commit" origin/main
          grep -Fxq "  @version \"$version\"" mix.exs
          if ! bash .github/scripts/release-notes.sh "$version" > /dev/null; then
            echo "The changelog has no release entry for $version." >&2
            exit 1
          fi

          if ! conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --commit "$commit" --event push --limit 1 --json conclusion --jq '.[0].conclusion // ""')"; then
            echo "Could not verify CI for the release commit." >&2
            exit 1
          fi
          if [[ "$conclusion" != success ]]; then
            echo "The latest CI run from a push to main for the release commit must pass." >&2
            exit 1
          fi
          printf 'version=%s\ncommit=%s\n' "$version" "$commit" >> "$GITHUB_OUTPUT"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "29"
          elixir-version: "1.20.4"
          install-hex: false
      - run: mix local.hex "$HEX_VERSION" --force
      - run: mix deps.get
      - run: bash .github/scripts/release-preflight.sh "$RUNNER_TEMP/tune-hex"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tune-hex
          path: ${{ runner.temp }}/tune-hex

  prepare:
    name: Create release tag
    if: ${{ inputs.operation == 'prepare' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
      - name: Push the annotated version tag
        env:
          TAG: v${{ needs.verify.outputs.version }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          ref="refs/tags/$TAG"
          if git show-ref --verify --quiet "$ref"; then
            if [[ "$(git cat-file -t "$ref")" != tag || "$(git rev-parse "$ref^{commit}")" != "$COMMIT" ]]; then
              echo "$TAG already exists as a different tag." >&2
              exit 1
            fi
            echo "$TAG already points to $COMMIT."
            exit 0
          fi

          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$TAG" -m "Release $TAG" "$COMMIT"
          git push origin "$ref:$ref"

  publish:
    name: Publish to Hex
    if: ${{ inputs.operation == 'publish' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: hex-publish
    outputs:
      staged: ${{ steps.submit.outputs.staged }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "29"
          elixir-version: "1.20.4"
          install-hex: false
      - run: mix local.hex "$HEX_VERSION" --force
      - run: mix deps.get
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tune-hex
          path: ${{ runner.temp }}/tune-hex
      - name: Confirm package files match the verified build
        run: |
          check_dir="$(mktemp -d)"
          trap 'rm -rf "$check_dir"' EXIT
          mix hex.build --output "$check_dir/tune.tar"
          tar -xf "$check_dir/tune.tar" -C "$check_dir"
          LC_ALL=C tar -tzf "$check_dir/contents.tar.gz" | LC_ALL=C sort > "$check_dir/manifest.txt"
          cmp "$RUNNER_TEMP/tune-hex/manifest.txt" "$check_dir/manifest.txt"
          tar -xOf "$RUNNER_TEMP/tune-hex/tune.tar" contents.tar.gz > "$check_dir/verified.tar.gz"
          mkdir "$check_dir/verified" "$check_dir/current"
          tar -xzf "$check_dir/verified.tar.gz" -C "$check_dir/verified"
          tar -xzf "$check_dir/contents.tar.gz" -C "$check_dir/current"
          diff -qr "$check_dir/verified" "$check_dir/current"
          tar -xOf "$RUNNER_TEMP/tune-hex/tune.tar" metadata.config > "$check_dir/verified.config"
          cmp "$check_dir/verified.config" "$check_dir/metadata.config"
      - name: Publish package and docs
        id: submit
        run: |
          if [[ -z "$HEX_API_KEY" ]]; then
            echo "Configure the Hex publish key in the hex-publish environment." >&2
            exit 1
          fi

          publish_log="$RUNNER_TEMP/tune-hex-publish.log"
          mix hex.publish --yes --no-progress 2>&1 | tee "$publish_log"

          if ! grep -Eq '^Package (published to|staged for approval at) ' "$publish_log" ||
             ! grep -Eq '^(Docs will soon be available at|Documentation staged for approval at) ' "$publish_log"; then
            echo "Hex did not confirm submission of both the package and docs." >&2
            exit 1
          fi

          if grep -Eq '^(Package|Documentation) staged for approval at ' "$publish_log"; then
            echo 'staged=true' >> "$GITHUB_OUTPUT"
            read -r checksum _ < "$RUNNER_TEMP/tune-hex/sha256.txt"
            {
              echo 'Hex requires approval. Open the publish step log for the approval link.'
              printf '\nPackage SHA-256 `%s`\n\n' "$checksum"
              printf 'After approval, run the Release workflow with `operation=finalize` on `%s`.\n' "$GITHUB_REF_NAME"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'staged=false' >> "$GITHUB_OUTPUT"
          fi
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  release:
    name: Verify Hex and create GitHub release
    needs: [verify, publish]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (inputs.operation == 'finalize' || (needs.publish.result == 'success' && needs.publish.outputs.staged == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "29"
          elixir-version: "1.20.4"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tune-hex
          path: ${{ runner.temp }}/tune-hex
      - name: Verify published metadata and docs
        run: |
          curl -fsS --retry 5 --retry-all-errors "https://hex.pm/api/packages/tune/releases/$VERSION" \
            | jq -er '.checksum | ascii_downcase' > "$RUNNER_TEMP/tune-hex-checksum"
          read -r expected _ < "$RUNNER_TEMP/tune-hex/sha256.txt"
          if [[ "$(cat "$RUNNER_TEMP/tune-hex-checksum")" != "$expected" ]]; then
            echo "The published Hex checksum differs from the package built from this tag." >&2
            exit 1
          fi
          archive="$RUNNER_TEMP/tune-published.tar"
          curl -fsS --retry 5 --retry-all-errors -o "$archive" "https://repo.hex.pm/tarballs/tune-$VERSION.tar"
          printf '%s  %s\n' "$expected" "$archive" | shasum -a 256 --check
          curl -fsS --retry 5 --retry-all-errors -o /dev/null "https://hexdocs.pm/tune/$VERSION/"
      - run: bash .github/scripts/smoke-consumer.sh "$VERSION" core
      - run: bash .github/scripts/smoke-consumer.sh "$VERSION" workbench
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          notes="$RUNNER_TEMP/tune-release-notes"
          bash .github/scripts/release-notes.sh "$VERSION" > "$notes"
          {
            printf '\n[Hex](https://hex.pm/packages/tune/%s) · [HexDocs](https://hexdocs.pm/tune/%s/)\n' "$VERSION" "$VERSION"
            printf '\nHex checksum: `%s`\n' "$(cat "$RUNNER_TEMP/tune-hex-checksum")"
          } >> "$notes"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Release $GITHUB_REF_NAME" --notes-file "$notes"
